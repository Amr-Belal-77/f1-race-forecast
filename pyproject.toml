[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-forecast"
version = "1.0.0"
description = "Reproducible F1 winner forecasting with chronological evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4", "requests>=2.32,<3", "joblib>=1.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
research = ["fastf1>=3.4,<4", "matplotlib>=3.8,<4"]

[project.scripts]
f1-forecast = "f1_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["f1_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/f1_forecast/**/*.py", "tests/**/*.py", "app.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
